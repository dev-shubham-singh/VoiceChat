# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/dev-shubham-singh/VoiceChat
services:
  - type: web
    name: voicechat
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: PREMIUM_CODES
        value: DEMO-PREMIUM
